name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Check the syntax
        run: |
          node scripts/check-js-modules.js
          node scripts/check-module-real.js
          node scripts/check-all-scripts.js
          node scripts/check-bridge.js
          node scripts/check-worker-sync.js
          node scripts/check-i18n.js
          node scripts/check-i18n-runtime.js

      - name: Run e2e tests
        run: npm test
        timeout-minutes: 15

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  verify-channels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run verify_channels
        run: npm run verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify_channels_report
          path: verify_channels_report.json
          retention-days: 7

  # Lighthouse budget: the app has to stay fast and accessible on a phone.
  # The budgets live in scripts/check-lighthouse.js, so they can be tuned in
  # one place.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save lighthouse wait-on

      - name: Run Lighthouse
        run: |
          npx serve . -p 3000 &
          npx wait-on http://localhost:3000 --timeout=60000
          npx lighthouse http://localhost:3000/ \
            --only-categories=performance,accessibility \
            --form-factor=mobile \
            --screenEmulation.mobile \
            --throttling-method=simulate \
            --output=json \
            --output-path=lighthouse-report.json \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu" \
            --quiet

      - name: Check the budgets
        run: node scripts/check-lighthouse.js lighthouse-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 7

  # GitHub Pages publishes the `main` branch, but the app is developed and
  # validated on `master`. This job fast-forwards `main` to `master` once
  # the tests are green, so the live site always serves the tested code.
  deploy-pages:
    needs: [e2e, verify-channels]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to master
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master main
          # Only a fast-forward is allowed — main must never diverge.
          if ! git merge-base --is-ancestor origin/main origin/master; then
            echo "::error::origin/main is not an ancestor of origin/master — refusing to force-push"
            exit 1
          fi
          git push origin origin/master:main
          echo "main is now up to date with master"
