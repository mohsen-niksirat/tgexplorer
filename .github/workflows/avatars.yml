name: Refresh Channel Avatars

on:
  schedule:
    - cron: '23 5 * * *'  # daily at 05:23 UTC (after several crawl runs)
  workflow_dispatch:      # manual trigger

permissions:
  contents: write

jobs:
  avatars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch avatars, commit and push
        run: |
          set -e
          node fetch_avatars.js

          git add avatars.js
          if git diff --cached --quiet; then
            echo "No avatar changes — nothing to push"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh channel avatars $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Push to the branch the app is developed on — the workflow used to
          # push to `main` while the code lived on `master`.
          bash scripts/push-branch.sh master avatars.js
