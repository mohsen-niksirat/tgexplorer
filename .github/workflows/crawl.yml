name: Crawl Channel Posts

on:
  schedule:
    - cron: '17 */6 * * *'  # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run post crawler
        run: node crawl_posts.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.js
          if git diff --cached --quiet; then
            echo "No data changes — nothing to push"
            exit 0
          fi
          git commit -m "chore: update channel posts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do git fetch origin main && break || sleep 5; done
          git rebase origin/main 2>/dev/null || true
          if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
            git checkout --theirs posts.js 2>/dev/null || true
            git add posts.js
            GIT_EDITOR=true git rebase --continue 2>/dev/null || true
          fi
          git push origin main
