name: Crawl Channel Posts

on:
  schedule:
    - cron: '17 */3 * * *'  # every 3 hours (00:17, 03:17, ... UTC)
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  issues: write

concurrency:
  group: tgexplorer-data-publish
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install serverless CLI
        if: env.TGCLOUD_TOKEN != ''
        run: npm --prefix serverless ci

      - name: Sync bot-approved channels
        id: sync
        continue-on-error: true
        if: env.TGCLOUD_TOKEN != '' && env.NOTIFY_SECRET != ''
        run: |
          cd serverless
          npx tgcloud run endpoints/approvedChannels "{\"secret\":\"${NOTIFY_SECRET}\"}" > ../approved_raw.txt
          cd ..
          node scripts/sync-approved-channels.js --from-tgcloud-output approved_raw.txt
          rm -f approved_raw.txt

      - name: Crawl, bump SW cache, commit and push
        run: |
          set -e
          node crawl_posts.js

          if ! git diff --quiet -- channels.js; then
            node scripts/generate-share-pages.js
          fi

          git add channels.js posts.js posts archive share rss summaries.json
          if git diff --cached --quiet; then
            echo "No data changes — nothing to push"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SYNC_N="${{ steps.sync.outputs.synced_count || '0' }}"
          if [ "$SYNC_N" -gt 0 ] 2>/dev/null; then
            git commit -m "chore(data): sync bot-approved channels (+${SYNC_N})"
          else
            git commit -m "chore: update channel posts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          bash scripts/push-branch.sh main channels.js posts.js posts archive share rss summaries.json

      - name: Trigger bot new-post notifications
        continue-on-error: true
        if: success() && env.TGCLOUD_TOKEN != ''
        run: |
          cd serverless
          npx tgcloud run endpoints/checkNotifications "{\"secret\":\"${NOTIFY_SECRET}\"}"

      - name: Auto-close stale failure issues
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_NUMS=$(gh issue list --repo "${{ github.repository }}" --state open --author "app/github-actions" --search "Crawl workflow failed in:title" --json number --jq '.[].number')
          for num in $OPEN_NUMS; do
            gh issue close "$num" --repo "${{ github.repository }}" --comment "✅ Crawl recovered on run #${{ github.run_number }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          done

      - name: Report failure (GitHub Issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --author "app/github-actions" --search "Crawl workflow failed in:title" --limit 1 --json number --jq '.[0].number // empty')
          BODY="The **Crawl Channel Posts** workflow failed on \`${{ github.ref }}\` (run #${{ github.run_number }}).\n\n[View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nTriggered by: ${{ github.event_name }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$(printf '%b' "$BODY")"
          else
            gh issue create --repo "${{ github.repository }}" --title "🤖 Crawl workflow failed (run #${{ github.run_number }})" --body "$(printf '%b' "$BODY")"
          fi
