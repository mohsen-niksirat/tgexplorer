name: Crawl Channel Posts

on:
  schedule:
    - cron: '17 */3 * * *'  # every 3 hours (00:17, 03:17, ... UTC)
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
      APPROVED_CHANNELS_URL: ${{ secrets.APPROVED_CHANNELS_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync bot-approved channels
        id: sync
        if: env.APPROVED_CHANNELS_URL != '' && env.NOTIFY_SECRET != ''
        run: node scripts/sync-approved-channels.js

      - name: Crawl, bump SW cache, commit and push
        run: |
          set -e
          node crawl_posts.js

          git add channels.js posts.js posts archive
          if git diff --cached --quiet; then
            echo "No data changes — nothing to push"
            exit 0
          fi

          # Unique cache name per run -> old SW caches get cleaned on activate,
          # so clients always pick up the freshly crawled data.
          python3 - <<'PYEOF'
          import re, datetime
          ver = datetime.datetime.utcnow().strftime('%Y%m%d%H%M')
          s = open('sw.js', encoding='utf-8').read()
          s = re.sub(r"const CACHE_NAME = '[^']*'", f"const CACHE_NAME = 'tgexplorer-{ver}'", s, count=1)
          open('sw.js', 'w', encoding='utf-8').write(s)
          PYEOF
          git add sw.js

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SYNC_N="${{ steps.sync.outputs.synced_count || '0' }}"
          if [ "$SYNC_N" -gt 0 ] 2>/dev/null; then
            git commit -m "chore(data): sync bot-approved channels (+${SYNC_N})"
          else
            git commit -m "chore: update channel posts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi

          bash scripts/push-branch.sh main channels.js posts.js posts archive sw.js

      - name: Trigger bot new-post notifications
        if: success() && env.NOTIFY_SECRET != ''
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" -X POST "https://app8812852999.tgcloud.ai/api/checkNotifications" \
            -H "Content-Type: application/json" \
            -H "X-Notify-Secret: ${NOTIFY_SECRET}" \
            -d "{\"secret\":\"${NOTIFY_SECRET}\"}" || true

      - name: Report failure (GitHub Issue)
        if: failure()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{\"title\": \"🤖 Crawl workflow failed (run #${{ github.run_number }})\", \"body\": \"The **Crawl Channel Posts** workflow failed on \`${{ github.ref }}\`.\n\n[View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nTriggered by: ${{ github.event_name }}\"}"
