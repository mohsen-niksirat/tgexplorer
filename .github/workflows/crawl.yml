name: Crawl Channel Posts

on:
  schedule:
    - cron: '17 */3 * * *'  # every 3 hours (00:17, 03:17, ... UTC)
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Crawl, bump SW cache, commit and push
        run: |
          set -e
          node crawl_posts.js

          git add posts.js posts
          if git diff --cached --quiet; then
            echo "No data changes — nothing to push"
            exit 0
          fi

          # Unique cache name per run -> old SW caches get cleaned on activate,
          # so clients always pick up the freshly crawled data.
          python3 - <<'PYEOF'
          import re, datetime
          ver = datetime.datetime.utcnow().strftime('%Y%m%d%H%M')
          s = open('sw.js', encoding='utf-8').read()
          s = re.sub(r"const CACHE_NAME = '[^']*'", f"const CACHE_NAME = 'tgexplorer-{ver}'", s, count=1)
          open('sw.js', 'w', encoding='utf-8').write(s)
          PYEOF
          git add sw.js

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update channel posts $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for i in 1 2 3 4 5; do git fetch origin main && break || sleep 5; done
          for attempt in 1 2 3 4 5; do
            git rebase origin/main 2>/dev/null || true
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git checkout --theirs posts.js 2>/dev/null || true
              git checkout --theirs sw.js 2>/dev/null || true
              git add posts.js posts sw.js 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi
            if git push origin main; then
              echo "Pushed successfully (attempt $attempt)"
              break
            fi
            echo "Push raced with another run — retrying ($attempt/5)"
            sleep 8
          done

      - name: Report failure (GitHub Issue)
        if: failure()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{\"title\": \"🤖 Crawl workflow failed (run #${{ github.run_number }})\", \"body\": \"The **Crawl Channel Posts** workflow failed on \`${{ github.ref }}\`.\n\n[View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\nTriggered by: ${{ github.event_name }}\"}"
