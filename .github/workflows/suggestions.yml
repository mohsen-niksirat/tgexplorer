name: Channel suggestion

# A suggested channel is checked against t.me; if it is a real public
# channel, a pull request that adds it to channels.js is opened.
on:
  issues:
    types: [opened, edited]
    labels: ["channel-suggestion"]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read the suggestion
        id: check
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          set -e
          # The body can come from the app's "Suggest a channel" dialog or
          # from the issue template - the parser understands both.
          node scripts/parse-suggestion.js "$BODY" > suggestion.json
          cat suggestion.json
          node -e "
            const s = require('./suggestion.json');
            const fs = require('fs');
            const out = [];
            for (const [k, v] of Object.entries(s)) {
              out.push(k + '<<EOF');
              out.push(v || '');
              out.push('EOF');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join('\n') + '\n');
          "

          if [ -z "${{ steps.check.outputs.username }}" ]; then
            echo "::error::No username found in the issue body"
            exit 1
          fi

      - name: Check the channel against t.me
        run: |
          node -e "
            const { check } = require('./verify_channels.js');
            const username = process.argv[1];
            check({ username }).then(r => {
              console.log('status: ' + r.status + ' — ' + r.reason);
              if (r.status !== 'OK') {
                console.error('::error::@' + username + ' is not a public channel (' + r.status + ')');
                process.exit(1);
              }
            }).catch(e => { console.error('::error::' + e.message); process.exit(1); });
          " "${{ steps.check.outputs.username }}"

      - name: Add the channel and open a pull request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ steps.check.outputs.username }}
          TITLE: ${{ steps.check.outputs.title }}
          LANG: ${{ steps.check.outputs.language }}
          CATEGORY: ${{ steps.check.outputs.category }}
          DESCRIPTION: ${{ steps.check.outputs.description }}
        run: |
          set -e
          # Normalise the language to the two-letter code the app uses.
          case "$(echo "$LANG" | tr '[:upper:]' '[:lower:]')" in
            persian|fa|farsi) CODE=fa ;;
            arabic|ar) CODE=ar ;;
            english|en) CODE=en ;;
            *) CODE=en ;;
          esac
          TITLE="${TITLE:-$USERNAME}"

          node scripts/add-channel.js "$USERNAME" "$TITLE" "$CODE" "$CATEGORY" "$DESCRIPTION"

          BRANCH="suggestion/$USERNAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add channels.js
          git commit -m "feat(channels): add @$USERNAME"
          git push -f origin "$BRANCH"

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Add @$USERNAME to the channel database" \
            --body "Suggested in #${{ github.event.issue.number }} by @${{ github.event.issue.user.login }}.\n\nThe channel was verified against t.me by the suggestion workflow."

      - name: Comment on the issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "✅ @${{ steps.check.outputs.username }} is a public channel - a pull request has been opened."

      - name: Comment on the issue when the channel is not usable
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "❌ @${{ steps.check.outputs.username }} could not be verified as a public Telegram channel. If the channel is new, it may not have a web preview yet - try again in a little while."
